<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- build:meta -->
  <!-- /build:meta -->
  <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=5.3.0" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin-800-normal.woff2?v=5.3.0" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/icon-btn.css">
  <link rel="stylesheet" href="/assets/css/lang.css">
  <link rel="stylesheet" href="/assets/css/game.css">
  <link rel="stylesheet" href="/assets/css/flappy.css">
  <script src="/assets/js/analytics.js"></script>
</head>
<body class="play">
  <canvas id="bg" data-alpha="0.12" aria-hidden="true"></canvas>

  <header class="bar">
    <a class="wordmark" href="/" aria-label="Back to bdnix"><b>bdnix</b><span translate="no">/ flap</span></a>
    <div class="bar-actions">
      <nav class="langs" aria-label="Language" data-languages></nav>
      <button type="button" id="soundBtn" class="icon-btn" aria-label="Mute sound"></button>
    </div>
  </header>

  <main class="game" id="game">
    <section class="panel box stats">
      <div><span class="label">Score</span><b id="score">0</b></div>
      <div><span class="label">Best</span><b id="best">0</b></div>
    </section>

    <div class="board-wrap">
      <canvas id="board" role="img" aria-label="Flap board"></canvas>
      <div id="overlay" class="overlay">
        <p class="label" id="ovKicker">bdnix arcade</p>
        <h1 id="ovTitle">Flap</h1>
        <p id="ovText">Flap through the gaps. Don’t touch the pipes.</p>
        <div class="ov-actions">
          <button type="button" id="startBtn" class="btn btn-primary">Start game</button>
          <button type="button" id="newBtn" class="btn btn-ghost" hidden>New game</button>
        </div>
        <p class="keys only-keys"><kbd>Space</kbd>, <kbd>↑</kbd> or click to flap · <kbd>P</kbd> pause</p>
        <p class="keys only-touch">Tap anywhere to flap.</p>
        <p class="credit">Inspired by Flappy Bird, created by Dong Nguyen in 2013. Flappy Bird is a trademark of its owner; bdnix isn’t affiliated with or endorsed by them.</p>
      </div>
    </div>
  </main>

  <script src="/assets/js/blocks.js"></script>
  <script src="/assets/js/gamesave.js"></script>
  <script src="/assets/js/sound.js"></script>
  <script src="/assets/js/upright.js"></script>
  <script src="/assets/js/flappy-core.js"></script>
  <script src="/assets/js/flappy.js"></script>
</body>
</html>
