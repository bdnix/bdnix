name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The PR's own head commit rather than GitHub's merge commit, so coverage
      # line numbers match the pull request's diff.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      # Every page links its scripts and styles with ?v=<hash of the file>.
      # Fails if a change to assets/js or assets/css wasn't followed by
      # `npm run build`, which would let browsers keep a stale copy.
      - name: Cache-busting hashes are up to date
        run: npm run build:check
      - name: Unit tests with coverage
        run: npm run coverage:unit
      - name: Save coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-unit
          path: coverage/unit/raw/
          retention-days: 1

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - id: playwright
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: UI tests with coverage
        run: npm run coverage:ui
      - name: Save coverage data
        uses: actions/upload-artifact@v7
        with:
          name: coverage-data-ui
          path: coverage/ui/raw/
          retention-days: 1
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Combines both suites' coverage into one report and publishes it to
  # GitHub, which compares each pull request with master and shows the
  # result on the pull request. Runs only when all tests pass.
  coverage:
    name: Code coverage
    needs: [unit, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      code-quality: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: coverage-data-unit
          path: coverage/unit/raw/
      - uses: actions/download-artifact@v8
        with:
          name: coverage-data-ui
          path: coverage/ui/raw/
      - name: Combine coverage
        run: npm run coverage:report
      - name: Coverage summary
        run: cat coverage/report/coverage-details.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/report/
          retention-days: 30
      # Pull requests from forks can't be given write access, so they skip it.
      - name: Publish coverage to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: coverage/report/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/bdnix
