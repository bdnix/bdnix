name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Every page links its scripts and styles with ?v=<hash of the file>.
      # Fails if a change to assets/js or assets/css wasn't followed by
      # `npm run build`, which would let browsers keep a stale copy.
      - name: Cache-busting hashes are up to date
        run: npm run build:check
      - name: Unit tests with coverage
        run: npm run coverage:unit
      # Fails if coverage fell below tests/coverage/baseline.json (see AGENTS.md).
      - name: Coverage hasn't dropped
        run: node scripts/coverage-check.mjs unit
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/unit/coverage-details.md') != '' }}
        run: cat coverage/unit/coverage-details.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/unit/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit/
          retention-days: 30

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: UI tests with coverage
        run: npm run coverage:ui
      - name: Coverage hasn't dropped
        run: node scripts/coverage-check.mjs ui
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/ui/coverage-details.md') != '' }}
        run: cat coverage/ui/coverage-details.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/ui/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ui
          path: coverage/ui/
          retention-days: 30
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
