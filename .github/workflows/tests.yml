name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every test, ignoring cached results
        type: boolean
        default: false
  # Once a week, every test runs on master, ignoring cached results: a check
  # that the cache hasn't kept a result it shouldn't have.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # On a pull request, a newer push replaces a run still in progress. Runs on
  # master always finish, so every commit there gets its coverage report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The unit and UI tests run in parallel, each with coverage. Once both
  # pass, the coverage job uploads their reports to Codecov together (see
  # codecov.yml), so Codecov never builds a report from one suite alone.
  #
  # Tests whose inputs haven't changed since they last passed aren't run
  # again: their cached result and coverage are used instead, test file by
  # test file (scripts/unit-cache.mjs, scripts/ui-cache.mjs). A test's inputs
  # are what it uses (scripts/test-deps.mjs), so a change reruns only the
  # tests that use what changed.
  # Run the workflow by hand with "full" ticked to ignore the cache; the
  # weekly scheduled run does too.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # ESLint for the scripts and tests, Stylelint for the stylesheets.
      # Quick, so never cached.
      - name: Lint
        run: npm run lint
      # The newest cache from this branch, or else from master. It holds the
      # result, coverage and inputs of every unit test file that passed
      # recently (scripts/unit-cache.mjs).
      - name: Restore unit test results from cache
        if: ${{ !(inputs.full || github.event_name == 'schedule') }}
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/unit
          key: unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: unit-tests-
      # Runs the test files whose inputs changed, brings back the others'
      # coverage, and caches every file that passed. Runs even if lint
      # failed, so one run reports both.
      - name: Unit tests with coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:unit:cached
      - name: Save unit test results to cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/unit
          key: unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          retention-days: 1

  # The UI tests run on four machines at once, however many specs a run
  # has to run. The plan restores the cache, finds the specs whose inputs
  # changed and shares them out by how long each last took
  # (scripts/ui-cache.mjs --plan); each machine runs its share and keeps the
  # results of the specs that passed; the last job puts those together with
  # the restored cache, checks every spec now has a passing result and that
  # each module's specs used only what it declares, merges the coverage and
  # saves the cache.
  ui-plan:
    name: UI tests, plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.plan.outputs.run }}
      shards: ${{ steps.plan.outputs.shards }}
      cache: ${{ steps.restore.outputs.cache-matched-key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The newest cache from this branch, or else from master. It holds the
      # result, coverage and responses of every spec that passed recently.
      - id: restore
        name: Restore UI test results from cache
        if: ${{ !(inputs.full || github.event_name == 'schedule') }}
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/ui
          key: ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ui-results-
      - id: plan
        name: Find the specs to run, and share them out
        run: npm run coverage:ui:cached -- --plan --shards=4

  ui-machine:
    name: UI tests, machine ${{ matrix.machine }} of 4
    needs: ui-plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # share is the machine's place in the plan's list (from 0).
        include:
          - { machine: 1, share: 0 }
          - { machine: 2, share: 1 }
          - { machine: 3, share: 2 }
          - { machine: 4, share: 3 }
    env:
      SPECS: ${{ fromJSON(needs.ui-plan.outputs.shards)[matrix.share] }}
    steps:
      - uses: actions/checkout@v7
        if: env.SPECS != ''
      - uses: ./.github/actions/setup
        if: env.SPECS != ''
      - id: playwright
        if: env.SPECS != ''
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        if: env.SPECS != ''
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: env.SPECS != '' && steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: env.SPECS != '' && steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Runs this machine's share and keeps the result, coverage and
      # responses of every spec that passed, in .test-cache/ui.
      - name: UI tests with coverage
        if: env.SPECS != ''
        run: npm run coverage:ui:cached -- --run $SPECS
      # Kept even when a spec failed, so the ones that passed needn't run
      # again after the fix.
      - name: Keep the results
        if: ${{ !cancelled() && env.SPECS != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ui-results-${{ matrix.machine }}
          path: .test-cache/ui/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 1
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.machine }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  ui:
    name: UI tests
    needs: [ui-plan, ui-machine]
    if: ${{ !cancelled() && needs.ui-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Exactly the cache the plan restored, so the specs it found cached
      # are still cached here.
      - name: Restore the plan's UI test results
        if: needs.ui-plan.outputs.cache != ''
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/ui
          key: ${{ needs.ui-plan.outputs.cache }}
          fail-on-cache-miss: true
      - name: Add the machines' results
        if: needs.ui-plan.outputs.run != '0'
        uses: actions/download-artifact@v8
        with:
          pattern: ui-results-*
          path: .test-cache/ui/
          merge-multiple: true
      # Fails unless every spec has a passing result now; merges their
      # coverage into coverage/ui.
      - name: Check the results and merge the coverage
        run: npm run coverage:ui:cached -- --merge
      - name: Save UI test results to cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/ui
          key: ui-results-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ui
          path: coverage/ui/lcov.info
          retention-days: 1

  coverage:
    name: Coverage
    needs: [unit, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Lets the Codecov upload sign in with GitHub's OIDC token, so there's
      # no Codecov secret to set up.
      id-token: write
    steps:
      # Codecov reads the commit and the file list from the checkout.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage/unit/
      - uses: actions/download-artifact@v8
        with:
          name: coverage-ui
          path: coverage/ui/
      # The upload fetches Codecov's CLI from cli.codecov.io. When that's
      # down the CLI never arrives, and with fail_ci_if_error off the step
      # still passed: nothing was uploaded and codecov/project and
      # codecov/patch never reported. So a failed upload fails the job, and
      # first gets one more try with the CLI from PyPI instead.
      - name: Upload coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/unit/lcov.info,coverage/ui/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      # PyPI's CLI is installed with pip, which the runner's own Python won't
      # do (it's managed by the system), so this one comes with its own.
      - name: Python for the Codecov CLI from PyPI
        if: steps.codecov.outcome == 'failure'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Upload coverage to Codecov again, with the CLI from PyPI
        if: steps.codecov.outcome == 'failure'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/unit/lcov.info,coverage/ui/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
          use_pypi: true
