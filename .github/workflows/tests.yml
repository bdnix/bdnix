name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run every test, ignoring cached results
        type: boolean
        default: false
  # Once a week, every test runs on master, ignoring cached results: a check
  # that the cache hasn't kept a result it shouldn't have.
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # On a pull request, a newer push replaces a run still in progress. Runs on
  # master always finish, so every commit there gets its coverage report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The unit and UI tests run in parallel, each with coverage. Once both
  # pass, the coverage job uploads their reports to Codecov together (see
  # codecov.yml), so Codecov never builds a report from one suite alone.
  #
  # Tests whose inputs haven't changed since they last passed aren't run
  # again: their cached result and coverage are used instead, test file by
  # test file (scripts/unit-cache.mjs, scripts/ui-cache.mjs). A test's inputs
  # are what it uses (scripts/test-deps.mjs), so a change reruns only the
  # tests that use what changed.
  # Run the workflow by hand with "full" ticked to ignore the cache; the
  # weekly scheduled run does too.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # ESLint for the scripts and tests, Stylelint for the stylesheets.
      # Quick, so never cached.
      - name: Lint
        run: npm run lint
      # The newest cache from this branch, or else from master. It holds the
      # result, coverage and inputs of every unit test file that passed
      # recently (scripts/unit-cache.mjs).
      - name: Restore unit test results from cache
        if: ${{ !(inputs.full || github.event_name == 'schedule') }}
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/unit
          key: unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: unit-tests-
      # Runs the test files whose inputs changed, brings back the others'
      # coverage, and caches every file that passed. Runs even if lint
      # failed, so one run reports both.
      - name: Unit tests with coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:unit:cached
      - name: Save unit test results to cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/unit
          key: unit-tests-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          retention-days: 1

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    # A full run (every spec, weekly or by hand) took 10 to 14 minutes on one
    # machine before the suite reached 998 tests, 23 minutes at 1,208, and
    # more with King of Streets' 3D page, so the limit leaves room for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # The newest cache from this branch, or else from master. It holds the
      # result, coverage and responses of every spec that passed recently.
      - name: Restore UI test results from cache
        if: ${{ !(inputs.full || github.event_name == 'schedule') }}
        uses: actions/cache/restore@v6
        with:
          path: .test-cache/ui
          key: ui-results-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ui-results-
      - id: playwright
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Runs the specs that need to, brings back the others' coverage, checks
      # each module's specs used only what it declares, and adds every spec
      # that passed to the cache.
      - name: UI tests with coverage
        run: npm run coverage:ui:cached
      # Saved even when a spec failed, so the ones that passed needn't run
      # again after the fix.
      - name: Save UI test results to cache
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v6
        with:
          path: .test-cache/ui
          key: ui-results-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Save coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ui
          path: coverage/ui/lcov.info
          retention-days: 1
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  coverage:
    name: Coverage
    needs: [unit, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Lets the Codecov upload sign in with GitHub's OIDC token, so there's
      # no Codecov secret to set up.
      id-token: write
    steps:
      # Codecov reads the commit and the file list from the checkout.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage/unit/
      - uses: actions/download-artifact@v8
        with:
          name: coverage-ui
          path: coverage/ui/
      # The upload fetches Codecov's CLI from cli.codecov.io. When that's
      # down the CLI never arrives, and with fail_ci_if_error off the step
      # still passed: nothing was uploaded and codecov/project and
      # codecov/patch never reported. So a failed upload fails the job, and
      # first gets one more try with the CLI from PyPI instead.
      - name: Upload coverage to Codecov
        id: codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/unit/lcov.info,coverage/ui/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
      # PyPI's CLI is installed with pip, which the runner's own Python won't
      # do (it's managed by the system), so this one comes with its own.
      - name: Python for the Codecov CLI from PyPI
        if: steps.codecov.outcome == 'failure'
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Upload coverage to Codecov again, with the CLI from PyPI
        if: steps.codecov.outcome == 'failure'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/unit/lcov.info,coverage/ui/lcov.info
          disable_search: true
          use_oidc: true
          fail_ci_if_error: true
          use_pypi: true
