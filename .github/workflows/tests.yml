name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # On a pull request, a newer push replaces a run still in progress. Runs on
  # master always finish, so every commit there gets its coverage report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # One job runs everything once: the hash check, the unit tests and the UI
  # tests, each with coverage, then uploads both suites' coverage to Codecov
  # together (see codecov.yml). The unit tests take seconds, so running them
  # in parallel elsewhere would save nothing.
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Lets the Codecov upload sign in with GitHub's OIDC token, so there's
      # no Codecov secret to set up.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # Every page links its scripts and styles with ?v=<hash of the file>.
      # Fails if a change to assets/js or assets/css wasn't followed by
      # `npm run build`, which would let browsers keep a stale copy.
      - name: Cache-busting hashes are up to date
        run: npm run build:check
      # The three checks run even when an earlier one failed, so one run
      # reports every problem.
      - name: Unit tests with coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:unit
      - name: UI tests with coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:ui
      # Only after everything passed, so Codecov never gets half a report.
      # A failed upload doesn't fail the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/unit/lcov.info,coverage/ui/lcov.info
          disable_search: true
          use_oidc: true
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
