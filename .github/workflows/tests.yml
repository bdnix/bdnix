name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Minify first: the unit tests also check the minified copies.
      - run: npm run build
      - name: Unit tests with coverage
        run: npm run coverage:unit
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/unit/coverage-details.md') != '' }}
        run: cat coverage/unit/coverage-details.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/unit/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit/
          retention-days: 30

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm run build
      - name: UI tests with coverage
        run: npm run coverage:ui
      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/ui/coverage-details.md') != '' }}
        run: cat coverage/ui/coverage-details.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('coverage/ui/lcov.info') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ui
          path: coverage/ui/
          retention-days: 30
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Once master's tests pass, commit freshly minified scripts (and the pages'
  # updated ?v= hashes) so GitHub Pages serves them.
  minify:
    name: Minify and commit
    needs: [unit, ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
      - uses: ./.github/actions/setup
      - run: npm run build
      - name: Commit changes
        id: commit
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Minified files are already up to date."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/js '*.html'
          # [skip ci] keeps this commit from starting any workflow, this one
          # included. (Pushes made with GITHUB_TOKEN don't start workflows
          # anyway; this keeps it that way if the token ever changes.)
          git commit -m "Minify JavaScript for ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:master
          echo "pushed=true" >> "$GITHUB_OUTPUT"
      # [skip ci] also skips the automatic Pages build for that commit, so
      # this request is what publishes the minified files. If it fails, the
      # job fails, rather than leaving the site on the previous build.
      - name: Request a GitHub Pages build
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
