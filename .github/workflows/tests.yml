name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # On a pull request, a newer push replaces a run still in progress. Runs on
  # master always finish, so every commit there gets its coverage report.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The unit and UI tests run in parallel, each with coverage. Once both
  # pass, the coverage job uploads their reports to Codecov together (see
  # codecov.yml), so Codecov never builds a report from one suite alone.
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Every page links its scripts and styles with ?v=<hash of the file>.
      # Fails if a change to assets/js or assets/css wasn't followed by
      # `npm run build`, which would let browsers keep a stale copy.
      - name: Cache-busting hashes are up to date
        run: npm run build:check
      # Runs even if the hash check failed, so one run reports both.
      - name: Unit tests with coverage
        if: ${{ !cancelled() }}
        run: npm run coverage:unit
      - name: Save coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/unit/lcov.info
          retention-days: 1

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: UI tests with coverage
        run: npm run coverage:ui
      - name: Save coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-ui
          path: coverage/ui/lcov.info
          retention-days: 1
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  coverage:
    name: Coverage
    needs: [unit, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Lets the Codecov upload sign in with GitHub's OIDC token, so there's
      # no Codecov secret to set up.
      id-token: write
    steps:
      # Codecov reads the commit and the file list from the checkout.
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: coverage-unit
          path: coverage/unit/
      - uses: actions/download-artifact@v8
        with:
          name: coverage-ui
          path: coverage/ui/
      # A failed upload doesn't fail the job.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/unit/lcov.info,coverage/ui/lcov.info
          disable_search: true
          use_oidc: true
