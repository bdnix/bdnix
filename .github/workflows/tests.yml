name: Tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# id-token lets the Codecov upload sign in with GitHub's OIDC token, so
# there's no Codecov secret to set up.
permissions:
  contents: read
  id-token: write

# A newer push to the same branch or PR replaces a run still in progress.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# The UI tests job uploads both suites' coverage to Codecov, which combines
# them (see codecov.yml), reports on the pull request and draws the README
# badge. A failed upload doesn't fail the job.
jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Every page links its scripts and styles with ?v=<hash of the file>.
      # Fails if a change to assets/js or assets/css wasn't followed by
      # `npm run build`, which would let browsers keep a stale copy.
      - name: Cache-busting hashes are up to date
        run: npm run build:check
      - name: Unit tests
        run: npm run test:unit

  ui:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - id: playwright
        name: Playwright version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: browsers
        name: Restore Chromium from cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # The browser comes from the cache; the system libraries it needs are
      # apt packages, which can't be cached, so install just those.
      - name: Install Chromium's system libraries
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: UI tests with coverage
        run: npm run coverage:ui
      # The unit tests again, just for their coverage (they take seconds), so
      # both suites go to Codecov in one upload. Two separate uploads would
      # leave the badge showing only the first suite's share until the second
      # arrived.
      - name: Unit test coverage
        run: npm run coverage:unit
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage/unit/lcov.info,coverage/ui/lcov.info
          disable_search: true
          use_oidc: true
      - name: Upload test report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

