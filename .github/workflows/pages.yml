name: Pages

# Publishes www.bdnix.com from master: `npm run site` copies the published
# files into _site/ (tools/site.mjs), and that goes to GitHub Pages. The code
# is tested on its pull request (tests.yml) before it reaches master.
#
# Only master is ever published. The workflow runs on a push to master, and
# by hand; the job only runs for refs/heads/master, so a run started by hand
# on any other branch does nothing. (The github-pages environment's
# deployment branch rule should say the same, as a second lock.)
#
# Needs Settings → Pages → Source set to GitHub Actions.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and a deploy in progress always finishes.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Copy the published files into _site/
        run: npm run site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
