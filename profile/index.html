<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- build:meta -->
  <!-- /build:meta -->
  <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=5.3.0" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin-800-normal.woff2?v=5.3.0" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/avatar.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
  <link rel="stylesheet" href="/assets/css/page.css">
  <link rel="stylesheet" href="/assets/css/lang.css">
  <link rel="stylesheet" href="/assets/css/profile.css">
  <script src="/assets/js/analytics.js"></script>
</head>
<body>
  <canvas id="bg" data-alpha="0.12" aria-hidden="true"></canvas>

  <header class="bar">
    <a class="wordmark" href="/" aria-label="Back to bdnix"><b>bdnix</b><span translate="no">/ profile</span></a>
    <nav class="langs" aria-label="Language" data-languages></nav>
  </header>

  <main class="tool">
    <p class="kicker">// profile</p>

    <section class="who panel">
      <span class="avatar avatar-lg" data-profile-initial translate="no" aria-hidden="true">U</span>
      <div class="who-text" id="nameView">
        <h1 data-profile-name translate="no">User</h1>
        <button class="link-btn" id="editBtn" type="button">Edit name</button>
      </div>
      <form class="name-form" id="nameForm" hidden>
        <label class="label" for="nameInput">Your name</label>
        <div class="name-row">
          <input type="text" id="nameInput" maxlength="24" autocomplete="nickname" spellcheck="false">
          <button class="btn btn-primary btn-sm" type="submit">Save</button>
          <button class="btn btn-ghost btn-sm" id="cancelBtn" type="button">Cancel</button>
        </div>
        <p class="hint">Up to 24 characters. Leave it empty to go back to “User”.</p>
      </form>
    </section>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <section aria-labelledby="scoresLabel">
      <p class="label" id="scoresLabel">Best scores</p>
      <div class="scores" id="scores">
        <!-- build:scores -->
        <!-- /build:scores -->
      </div>
    </section>

    <p class="stat" id="visits"></p>
    <section class="analytics panel" aria-labelledby="analyticsLabel">
      <div class="analytics-text">
        <p class="label" id="analyticsLabel">Analytics cookies</p>
        <p id="analyticsState"></p>
      </div>
      <button class="btn btn-ghost btn-sm" id="analyticsBtn" type="button"></button>
    </section>

    <p class="note">Your profile is kept in this browser only. It isn’t uploaded or shared, so it won’t follow you to other devices, and clearing this site’s data resets it.</p>
  </main>

  <!-- build:footer -->
  <!-- /build:footer -->

  <script src="/assets/js/blocks.js"></script>
  <script src="/assets/js/profile.js"></script>
  <script src="/assets/js/profile-page.js"></script>
</body>
</html>
