<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>bdnix</title>
  <meta name="description" content="Play Tetris and Pac-Man, or merge and watermark PDFs, right in your browser. Nothing to install and nothing uploaded.">
  <meta property="og:title" content="bdnix">
  <meta property="og:description" content="Play Tetris and Pac-Man, or merge and watermark PDFs, right in your browser. Nothing to install and nothing uploaded.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css?v=5">
  <link rel="stylesheet" href="/assets/css/style.css?v=4">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#080a12">
</head>
<body>
  <canvas id="bg" aria-hidden="true"></canvas>

  <header class="bar">
    <a class="wordmark" href="/"><b>bdnix</b></a>
    <a class="profile-chip" href="/profile/" title="Your profile"><span class="avatar" data-profile-initial aria-hidden="true">U</span><span data-profile-name>User</span></a>
  </header>

  <main class="hero">
    <p class="kicker">// games &amp; tools, right in your browser</p>
    <h1>Play a little.<br><em>Get things done.</em></h1>

    <p class="terminal" aria-live="polite"><span class="prompt">$</span> <span id="typed">play a round of tetris.</span><span class="cursor"></span></p>

    <section class="games" aria-labelledby="games-label">
      <p class="label" id="games-label">Games</p>
      <div class="game-cards">
        <a class="game-card panel" href="/play/">
          <svg class="gc-icon" viewBox="0 0 40 40" aria-hidden="true">
            <rect x="4" y="18" width="10" height="10" rx="2" fill="#a855f7"/>
            <rect x="15" y="18" width="10" height="10" rx="2" fill="#a855f7"/>
            <rect x="26" y="18" width="10" height="10" rx="2" fill="#a855f7"/>
            <rect x="15" y="7" width="10" height="10" rx="2" fill="#a855f7"/>
            <rect x="4" y="29" width="10" height="10" rx="2" fill="#22d3ee" opacity=".55"/>
            <rect x="15" y="29" width="10" height="10" rx="2" fill="#22d3ee" opacity=".55"/>
            <rect x="26" y="29" width="10" height="10" rx="2" fill="#22d3ee" opacity=".55"/>
          </svg>
          <span class="gc-text"><b>Tetris</b><span>Stack blocks, clear lines</span></span>
          <svg class="gc-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="game-card panel" href="/pacman/">
          <svg class="gc-icon" viewBox="0 0 40 40" aria-hidden="true">
            <path d="M14 20 L24.4 14 A12 12 0 1 0 24.4 26 Z" fill="#facc15"/>
            <circle cx="29" cy="20" r="2" fill="#eef1f8" opacity=".8"/>
            <circle cx="36" cy="20" r="2" fill="#eef1f8" opacity=".8"/>
          </svg>
          <span class="gc-text"><b>Pac-Man</b><span>Eat dots, dodge ghosts</span></span>
          <svg class="gc-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </section>

    <section class="games" aria-labelledby="tools-label">
      <p class="label" id="tools-label">Tools</p>
      <div class="game-cards">
        <a class="game-card panel" href="/merge-pdf/">
          <svg class="gc-icon" viewBox="0 0 40 40" aria-hidden="true">
            <rect x="5" y="5" width="18" height="23" rx="3" fill="#22d3ee" opacity=".55"/>
            <rect x="17" y="12" width="18" height="23" rx="3" fill="#a855f7"/>
            <path d="M21 20h10M21 24h10M21 28h6" stroke="#eef1f8" stroke-width="2" stroke-linecap="round" opacity=".8"/>
          </svg>
          <span class="gc-text"><b>Merge PDFs</b><span>Combine PDFs into one</span></span>
          <svg class="gc-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
        <a class="game-card panel" href="/watermark-pdf/">
          <svg class="gc-icon" viewBox="0 0 40 40" aria-hidden="true">
            <rect x="9" y="4" width="22" height="32" rx="3" fill="#22d3ee" opacity=".55"/>
            <path d="M12 28 L28 12" stroke="#f472b6" stroke-width="4" stroke-linecap="round"/>
            <path d="M13 9h9M13 33h7" stroke="#eef1f8" stroke-width="2" stroke-linecap="round" opacity=".7"/>
          </svg>
          <span class="gc-text"><b>Watermark a PDF</b><span>Stamp text or a logo</span></span>
          <svg class="gc-arrow" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </a>
      </div>
    </section>

    <p id="visit" class="visit"></p>
  </main>

  <footer class="foot">
    <span>© <span id="year">2026</span> bdnix</span>
    <a href="mailto:root@bdnix.com">root@bdnix.com</a>
  </footer>

  <script src="/assets/js/blocks.min.js?v=2d41a89f74"></script>
  <script src="/assets/js/profile.min.js?v=f53ebe9180"></script>
  <script src="/assets/js/main.min.js?v=f0cdabc862"></script>
</body>
</html>
