<script type="module">

      const pa = P(new THREE.Vector3(a.x, a.y, a.z)), pb = P(new THREE.Vector3(b.x, b.y, b.z));

      if (v % 5 === 0) { g.fillStyle = '#c00'; g.font = '11px monospace'; const m = Object.assign({}, base); m[k] = v / 100; m[other] = base[other] + (k === ax[0] ? -half * 0.93 : 0) ; const pm = P(new THREE.Vector3(m.x, m.y, m.z)); g.fillText(k + (v / 100).toFixed(2), pm[0] + 2, pm[1] - 2); }
    }
