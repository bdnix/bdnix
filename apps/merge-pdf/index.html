<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <!-- build:meta -->
  <!-- /build:meta -->
  <link rel="preload" href="/assets/fonts/inter-latin-400-normal.woff2?v=5.3.0" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/fonts/inter-latin-800-normal.woff2?v=5.3.0" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/icon-btn.css">
  <link rel="stylesheet" href="/assets/css/avatar.css">
  <link rel="stylesheet" href="/assets/css/profile-chip.css">
  <link rel="stylesheet" href="/assets/css/footer.css">
  <link rel="stylesheet" href="/assets/css/lang.css">
  <link rel="stylesheet" href="/assets/css/page.css">
  <link rel="stylesheet" href="/assets/css/tool.css">
  <link rel="stylesheet" href="/assets/css/file.css">
  <link rel="stylesheet" href="/assets/css/merge.css">
  <script src="/assets/js/analytics.js"></script>
</head>
<body>
  <canvas id="bg" data-alpha="0.12" aria-hidden="true"></canvas>

  <header class="bar">
    <a class="wordmark" href="/" aria-label="Back to bdnix"><b>bdnix</b><span translate="no">/ merge-pdf</span></a>
    <div class="bar-end">
      <nav class="langs" aria-label="Language" data-languages></nav>
      <a class="profile-chip" href="/profile/" title="Your profile"><span class="avatar" data-profile-initial translate="no" aria-hidden="true">U</span><span data-profile-name translate="no">User</span></a>
    </div>
  </header>

  <main class="tool">
    <p class="kicker">// tools</p>
    <h1>Merge PDFs</h1>
    <p class="lede">Add your files, put them in order, pick the pages you want, check the preview, and merge them into one PDF. Everything happens in your browser. Your files are never uploaded.</p>

    <label class="drop panel" id="drop">
      <input type="file" id="picker" accept="application/pdf,.pdf" multiple>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <b>Drop PDF files here</b>
      <span>or <u>choose files</u></span>
    </label>

    <p class="msg" id="msg" role="status" aria-live="polite"></p>

    <section class="files" id="filesWrap" hidden>
      <div class="files-head">
        <span class="label" id="summary"></span>
        <button class="link-btn" id="clearBtn" type="button">Clear all</button>
      </div>
      <ol class="file-list" id="list"></ol>

      <section class="merge-preview panel" id="preview" aria-labelledby="previewTitle" hidden>
        <h2 class="label" id="previewTitle">Preview of merged.pdf</h2>
        <div class="preview-stage" id="stage">
          <canvas id="pageCanvas" role="img" aria-label="The merged PDF" hidden></canvas>
          <p class="preview-note" id="previewNote" role="status" aria-live="polite">Loading the preview…</p>
        </div>
        <div class="preview-nav">
          <button class="icon-btn" id="prevPage" type="button" aria-label="Previous page" disabled><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3L5 8l5 5"/></svg></button>
          <span class="label" id="pageLabel"></span>
          <button class="icon-btn" id="nextPage" type="button" aria-label="Next page" disabled><svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3l5 5-5 5"/></svg></button>
        </div>
      </section>

      <div class="actions">
        <button class="btn btn-primary" id="mergeBtn" type="button">
          <svg viewBox="0 0 16 16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3h6M3 8h10M3 13h6M11 11l2 2-2 2"/></svg>
          <span id="mergeLabel">Merge PDFs</span>
        </button>
      </div>
    </section>
  </main>

  <!-- build:footer -->
  <!-- /build:footer -->

  <script src="/assets/js/blocks.js"></script>
  <script src="/assets/js/profile.js"></script>
  <script src="/assets/js/files.js"></script>
  <script src="/assets/js/pdftools.js"></script>
  <script src="/assets/js/merge.js"></script>
</body>
</html>
