<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>bdnix — Tetris</title>
  <meta name="description" content="A tiny Tetris to play while bdnix is under construction.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/base.css?v=4">
  <link rel="stylesheet" href="/assets/css/game.css?v=4">
  <link rel="stylesheet" href="/assets/css/tetris.css?v=4">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#080a12">
</head>
<body class="play">
  <canvas id="bg" data-alpha="0.12" aria-hidden="true"></canvas>

  <header class="bar">
    <a class="wordmark" href="/" aria-label="Back to bdnix"><b>bdnix</b><span>/ tetris</span></a>
    <button id="pauseBtn" class="icon-btn" aria-label="Pause">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M4 2h3v12H4zM9 2h3v12H9z"/></svg>
    </button>
  </header>

  <main class="game" id="game">
    <section class="panel box hold">
      <span class="label">Hold</span>
      <canvas id="hold"></canvas>
    </section>

    <section class="panel box stats">
      <div><span class="label">Score</span><b id="score">0</b></div>
      <div><span class="label">Lines</span><b id="lines">0</b></div>
      <div><span class="label">Level</span><b id="level">1</b></div>
      <div><span class="label">Best</span><b id="best">0</b></div>
    </section>

    <section class="panel box next">
      <span class="label">Next</span>
      <canvas id="next"></canvas>
    </section>

    <div class="board-wrap">
      <canvas id="board"></canvas>
      <div id="overlay" class="overlay">
        <p class="label" id="ovKicker">bdnix arcade</p>
        <h1 id="ovTitle">Tetris</h1>
        <p id="ovText">Clear lines. Don't hit the top.</p>
        <button id="startBtn" class="btn btn-primary">Start game</button>
        <p class="keys only-keys">← → move · ↑ rotate · ↓ soft drop<br>Space hard drop · C hold · P pause</p>
        <p class="keys only-touch">Use the buttons below. Tap the board to rotate.</p>
      </div>
    </div>
  </main>

  <nav class="touch" aria-label="Game controls">
    <button data-act="hold" aria-label="Hold"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg></button>
    <button data-act="left" aria-label="Move left"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button data-act="rotate" aria-label="Rotate"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg></button>
    <button data-act="right" aria-label="Move right"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button data-act="down" aria-label="Soft drop"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    <button data-act="drop" aria-label="Hard drop"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5l6 6 6-6M6 11l6 6 6-6M5 20h14"/></svg></button>
  </nav>

  <script src="/assets/js/blocks.js?v=4"></script>
  <script src="/assets/js/tetris.js?v=4"></script>
</body>
</html>
